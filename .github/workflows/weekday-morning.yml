name: Weekday morning interest post

on:
  schedule:
    # Run at 15:00 and 16:00 UTC on weekdays. These cron slots are the
    # sole arbiter of "morning" (the script has no local time gate),
    # so the schedule fires year-round despite DST and tolerates
    # GitHub's scheduled-run delays (runs are frequently late by 1-3 hours).
    - cron: '0 15,16 * * 1-5'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Post morning message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: node scripts/morning-post.js
