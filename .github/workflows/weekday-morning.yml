name: Weekday morning interest post

# Schedule disabled 2026-11-06 at owner request (bot paused, will be revived
# later). workflow_dispatch kept so the post can be run/tested manually.
# To revive: restore the schedule block below.
#
#   schedule:
#     - cron: '0 15,16 * * 1-5'
#
on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Post morning message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: node scripts/morning-post.js
